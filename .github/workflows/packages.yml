name: Packages

on:
  push:
    branches: [ main ]
    paths: [ 'packaging/**', '.github/workflows/packages.yml' ]
  pull_request:
    paths: [ 'packaging/**', '.github/workflows/packages.yml' ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check the release tag matches the code
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^UH_VERSION="\([^"]*\)"/\1/p' lib/core.sh)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG but UH_VERSION is $version"; exit 1; }
      - name: Build
        env:
          SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          NFPM_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            key_file="$RUNNER_TEMP/package-signing.asc"
            printf '%s\n' "$SIGNING_KEY" > "$key_file"
            export PACKAGE_SIGNING_KEY="$key_file"
          else
            echo "::warning::PACKAGE_SIGNING_KEY is not set, so these packages are unsigned"
          fi
          bash packaging/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  install-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - rockylinux:8
          - rockylinux:9
          - almalinux:8
          - almalinux:9
          - fedora:40
          - archlinux:latest
          - alpine:latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Install, run and remove the package
        run: |
          version=$(sed -n 's/^UH_VERSION="\([^"]*\)"/\1/p' lib/core.sh)
          docker run --rm -v "$PWD:/repo:ro" "${{ matrix.distro }}" \
            sh -c 'command -v bash >/dev/null || apk add --no-cache -q bash
                   exec bash /repo/packaging/test-package.sh /repo/dist "$1"' sh "$version"

  # makepkg refuses to run as root. The PKGBUILD builds its pinned tag, so this
  # also proves the recorded checksum still matches GitHub's tarball.
  aur:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build, install and run the AUR package
        run: |
          docker run --rm -v "$PWD/packaging/aur:/aur:ro" archlinux:latest bash -euc '
            pacman -Syu --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            cp /aur/PKGBUILD /home/builder/
            chown builder: /home/builder/PKGBUILD
            su builder -c "cd ~ && makepkg --noconfirm"
            pacman -U --noconfirm /home/builder/ultimate-hardening-*.pkg.tar.*
            ultimate-harden --version'

  publish:
    if: github.event_name == 'release'
    needs: install-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
