name: ShellCheck

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# This repository is the FREE tier only. Pro and Enterprise live in a separate
# private repository and are deliberately not referenced by any job here — a
# step that lints src/pro/* would fail on a clean clone of this repo. The
# private repo runs the equivalent checks against lib/ from here plus its own
# tier scripts.
jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck — lib/ (shared by all tiers)
        run: shellcheck --severity=warning -x -e SC2034 -e SC1091 -e SC2154 lib/*.sh

      - name: ShellCheck — Free tier
        run: shellcheck --severity=warning -x -e SC2034 -e SC1091 -e SC2154 src/free/ultimate_hardening.sh

      - name: ShellCheck — helper scripts
        run: shellcheck --severity=warning -x -e SC2034 -e SC1091 -e SC2154 scripts/*.sh tests/*.sh tests/lib/*.sh tests/cases/*.sh

      # Not distro-dependent, and the matrix's minimal containers have no git,
      # so it would only ever skip there. The integration suite per distro is
      # in test-matrix.yml.
      - name: Publication guard
        run: REPO_ROOT="$PWD" bash tests/cases/test_publication_guard.sh
