name: OpenSSF Scorecard

# OpenSSF Scorecard grades the repository's own supply-chain practices (pinned
# actions, token permissions, branch protection, signed releases and so on).
# The results go to the repository's Security tab as SARIF and, because
# publish_results is on, to the public Scorecard API, which serves the score
# badge. Scorecard only allows checkout, upload-artifact, upload-sarif and
# itself in a workflow that publishes, so nothing else belongs in this file.
#
# Runner policy as in shellcheck.yml: ubuntu-24.04, actions pinned to a full
# commit SHA with the version tag in the trailing comment.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 6 * * 1'
  # Scorecard's Branch-Protection check reads this event's settings.
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # upload the SARIF to the Security tab
      id-token: write          # sign the results published to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
