name: Multi-Distro Test Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0'

# This repository is the FREE tier only. Pro and Enterprise live in a separate
# private repository and are deliberately not referenced here — a step that
# ran src/pro/* would fail the whole matrix on a clean clone of this repo.
jobs:
  test:
    name: Test on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    # debian:12 takes ~9 min here; dnf distros are slower. The cap stops a
    # hang from burning GitHub's 6h default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # debian:11 dropped: its LTS ended 2026-08-31 and deb.debian.org now
        # 404s its security pool, so the leg fails before reaching any code.
        distro:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - rockylinux:8
          - rockylinux:9
          - almalinux:8
          - almalinux:9
          - fedora:40
          - archlinux:latest
          - alpine:latest

    # No job-level `container:`. The cases apply real hardening and assume a
    # pristine system each; sharing one container let earlier cases harden
    # sshd_config and install packages before later ones looked, and those
    # failed on state rather than code. tests/run.sh gives each case its own
    # fresh container, exactly as it does locally.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n src/free/ultimate_hardening.sh
          for f in lib/*.sh; do bash -n "$f"; done

      # --auto-mode must exit without reaching the interactive menu. In v2.2.0
      # it did not, and show_menu recursed forever on CI's empty stdin. The 'Q'
      # quits cleanly if that regression returns, and the timeout caps it.
      # Do not "simplify" this to </dev/null: EOF on a menu read is exactly
      # what triggers the recursion. tests/cases/test_dryrun.sh separately
      # proves a dry run writes nothing.
      - name: Free tier dry-run exits non-interactively
        run: |
          docker run --rm -v "$PWD:/repo:ro" -e UH_TEST=1 "${{ matrix.distro }}" sh -c '
            command -v bash >/dev/null || apk add --no-cache -q bash
            command -v find >/dev/null || dnf install -y -q findutils
            printf "Q\n" | timeout 300 bash /repo/src/free/ultimate_hardening.sh --dry-run --auto-mode'

      - name: Integration suite (fresh container per case)
        run: bash tests/run.sh --distro "${{ matrix.distro }}"
